<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "a1c4a35e-ff03-4102-b973-bbf07fd00995",
      // Additional configuration can go here if needed
    });
  });

  // Function to get the OneSignal player ID after SDK initialization
  window.getPlayerId = async function() {
    const userState = await OneSignal.User.getState();
    return userState ? userState.pushSubscription.id : null;
  };

  document.addEventListener("DOMContentLoaded", async function() {
    console.log("DOMContentLoaded event triggered");
    const playerId = await window.getPlayerId();
    console.log("OneSignal Player ID: ", playerId);
  });
</script>

<!-- Firebase Messaging Initialization -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const firebaseConfig = {
  apiKey: "AIzaSyDHQSFuRnUszrTdmrsA8y3JebQiYfPIyPQ",
  authDomain: "qualitysystem-74ae9.firebaseapp.com",
  projectId: "qualitysystem-74ae9",
  storageBucket: "qualitysystem-74ae9.firebasestorage.app",
  messagingSenderId: "79320910267",
  appId: "1:79320910267:web:f12a962941ac8991d85c9e",
  measurementId: "G-B9SJVCR0VC"
    };
    firebase.initializeApp(firebaseConfig);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('firebase-messaging-sw.js')
        .then(function(registration) {
          console.log('Service Worker Registered!', registration);

          const messaging = firebase.messaging();
          messaging.useServiceWorker(registration);

          messaging.getToken({ vapidKey: "YOUR_VAPID_KEY" })
            .then((currentToken) => {
              if (currentToken) {
                console.log('Current token for client: ', currentToken);
              } else {
                console.log('No registration token available.');
              }
            }).catch((err) => {
              console.log('An error occurred while retrieving token. ', err);
            });

        }).catch(function(err) {
          console.log('Service Worker registration failed: ', err);
        });
    }
  });
</script>
